name: Validate and deploy Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'addin/**', 'desktop/**', 'scripts/bundle-font.ps1', 'tests/browser-smoke.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Bundle verified Pretendard font
        shell: pwsh
        run: ./scripts/bundle-font.ps1
      - name: Bundle local editor for installer test
        shell: powershell
        run: Copy-Item -LiteralPath site -Destination addin/FusionMacroStudio/web -Recurse
      - name: Test installer on Windows PowerShell 5.1
        shell: powershell
        run: ./addin/setup.ps1 -SelfTest
  desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test standalone editor storage and syntax
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --test desktop/storage.test.cjs desktop/addin-release.test.cjs
      - name: Bundle verified Pretendard font
        shell: pwsh
        run: ./scripts/bundle-font.ps1
      - name: Package Windows editor and bundled add-in
        shell: pwsh
        run: |
          Copy-Item -LiteralPath site -Destination desktop/site -Recurse
          New-Item -ItemType Directory -Path desktop/addin-package | Out-Null
          Copy-Item -LiteralPath addin/setup.ps1 -Destination desktop/addin-package
          Copy-Item -LiteralPath desktop/prepare-release.ps1 -Destination desktop/addin-package
          Copy-Item -LiteralPath addin/FusionMacroStudio -Destination desktop/addin-package/FusionMacroStudio -Recurse
          Copy-Item -LiteralPath site -Destination desktop/addin-package/FusionMacroStudio/web -Recurse
          & ./desktop/create-app-icon.ps1 -Source ./desktop/assets/app-icon.png -OutputDirectory ./desktop/build
          Set-Location desktop
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          if (!(Test-Path dist/latest.yml)) { throw 'Missing desktop update metadata' }
      - uses: actions/upload-artifact@v4
        with:
          name: FusionMacroStudio-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
  validate:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js && node --check site/assets.js && node --test site/*.test.js
      - name: Bundle verified Pretendard font
        shell: pwsh
        run: ./scripts/bundle-font.ps1
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/fms-browser" --no-package-lock playwright@1.51.1
          "$RUNNER_TEMP/fms-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify editor in Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/fms-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          FMS_PLAYWRIGHT="$RUNNER_TEMP/fms-browser/node_modules/playwright/index.mjs" node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FusionMacroStudio-browser-preview
          path: browser-preview
          if-no-files-found: ignore
      - run: python -m unittest discover -s addin/tests && python -m compileall -q addin/FusionMacroStudio
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'addin/setup.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'Installer syntax error' }
      - run: cp -R site addin/FusionMacroStudio/web
      - run: mkdir -p site/downloads && cd addin && zip -r ../site/downloads/FusionMacroStudio-Addin-Setup.zip FusionMacroStudio Setup.cmd setup.ps1 README.txt -x '*/__pycache__/*'
      - name: Publish versioned update manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          manifest=json.loads(pathlib.Path('addin/FusionMacroStudio/FusionMacroStudio.manifest').read_text())
          version=manifest['version']
          folder=pathlib.Path('site/downloads')
          source=folder/'FusionMacroStudio-Addin-Setup.zip'
          name=f'FusionMacroStudio-Addin-Setup-{version}.zip'
          shutil.copyfile(source,folder/name)
          raw=source.read_bytes()
          (folder/'latest.json').write_text(json.dumps(dict(version=version,file=name,sha256=hashlib.sha256(raw).hexdigest(),size=len(raw))))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FusionMacroStudio-Addin-Setup
          path: site/downloads/FusionMacroStudio-Addin-Setup.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FusionMacroStudio-web
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: FusionMacroStudio-Windows
          path: site/downloads/desktop
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: [validate, windows-installer]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
