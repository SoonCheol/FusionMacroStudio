<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fusion Macro Studio 아이콘 검토</title><link rel="stylesheet" href="style.css"><body><header class="top"><h1>명령 아이콘 검토</h1><a href="index.html">편집기로 돌아가기</a><button id="theme">테마 변경</button></header><section style="padding:16px"><p class="hint">독자 제작 벡터 · 실제 Fusion 원본과 동일한 그림이 아님. 명령별 또는 기능군별 시각화.</p><div id="summary"></div><div id="gallery" class="command-cards" style="max-height:none;grid-template-columns:repeat(auto-fill,minmax(100px,1fr))"></div></section><script type="module">import {iconKind,iconUrl} from './command-icons.js';const data=await fetch('data/menu.json').then(r=>r.json()), cmds=[...new Map(data.entries.map(e=>[e.id,e])).values()];document.getElementById('summary').textContent=cmds.length+'개 명령 / '+new Set(cmds.map(c=>iconKind(c.id,c))).size+'개 벡터 종류';for(const c of cmds){const b=document.createElement('div');b.className='command-card';b.title=c.id+' · '+iconKind(c.id,c);const i=document.createElement('img');i.className='art vector-art';i.src=iconUrl(c.id,c);i.alt='';const n=document.createElement('span');n.className='name';n.textContent=c.name;b.append(i,n);document.getElementById('gallery').append(b)}document.getElementById('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';</script></body></html>
