<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fusion Macro Studio 아이콘 검토</title><link rel="stylesheet" href="style.css"><body><header class="top"><h1>명령 아이콘 검토</h1><a href="index.html">편집기로 돌아가기</a><button id="theme">테마 변경</button></header><section style="padding:16px"><p class="hint">원본 대조 재작업: 공식 도움말의 이미지 파일을 실제로 열어 본 명령만 별도로 표시합니다. 나머지는 이전 임시 시안입니다.</p><div id="summary"></div><div id="gallery" class="command-cards" style="max-height:none;grid-template-columns:repeat(auto-fill,minmax(100px,1fr))"></div></section><script type="module">import {iconKind,iconUrl,referenceIcons} from './command-icons.js';const data=await fetch('data/menu.json').then(r=>r.json()), cmds=[...new Map(data.entries.map(e=>[e.id,e])).values()];document.getElementById('summary').textContent=cmds.length+'개 명령 / '+new Set(cmds.map(c=>iconKind(c.id,c))).size+'개 벡터 종류 · 공식 참조 확인 '+Object.keys(referenceIcons).length+'개';for(const c of cmds){const b=document.createElement('div');b.className='command-card';b.title=c.id+' · '+iconKind(c.id,c);const i=document.createElement('img');i.className='art vector-art';i.src=iconUrl(c.id,c);i.alt='';const n=document.createElement('span');n.className='name';n.textContent=c.name;const r=referenceIcons[c.id];const s=document.createElement('span');s.className='hint';s.textContent=r?'원본 참조 확인':'미검수 시안';b.style.height='102px';b.append(i,n,s);if(r){const link=document.createElement('a');link.href=r.source;link.textContent='원본';link.target='_blank';link.rel='noopener noreferrer';link.className='hint';b.append(link)}document.getElementById('gallery').append(b)}document.getElementById('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';</script></body></html>
