<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매크로 키보드 블루투스 테스트</title><link rel="stylesheet" href="bluetooth-test.css"></head>
<body>
<main><h1>블루투스 테스트</h1><p>12키 · 3노브 매크로 키보드</p><button id="bluetoothWizardOpen">테스트 시작</button><p class="small">USB 설정과 블루투스 입력을 비교합니다. 시험이 끝나면 원래 설정을 복원합니다.</p><details><summary>장치 통신 기록</summary><pre id="standaloneLog"></pre></details></main>
<dialog id="bluetoothWizard" aria-labelledby="wizardHeading"><h2 id="wizardHeading">블루투스 테스트</h2><p id="wizardMessage" role="status"></p><div id="wizardCapture" class="input-capture" tabindex="0" hidden></div><pre id="wizardResult" hidden></pre><div class="actions"><button id="wizardClose">닫기</button><button id="wizardCancel" hidden>중단 및 복원</button><button id="wizardNext">테스트 시작</button></div></dialog>
<script type="module" src="bluetooth-test.js"></script>
</body></html>
